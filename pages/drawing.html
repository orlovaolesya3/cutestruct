<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="icon" href="../paw.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Графический редактор</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        * { user-select: none; -webkit-tap-highlight-color: transparent; }
        
        .drawing-container {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 20px;
            margin: 20px 0;
            min-height: 700px;
        }
        
        .tools-panel {
            background: rgba(171, 205, 239, 0.1);
            border-radius: 20px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }
        
        body.dark-theme .tools-panel {
            background: rgba(30, 30, 50, 0.9);
            border: 1px solid rgba(29, 30, 51, 0.5);
        }
        
        .tools-section { margin-bottom: 20px; }
        .tools-section h3 { margin-bottom: 10px; font-size: 0.9em; font-weight: 600; }
        
        .tool-buttons { display: flex; flex-wrap: wrap; gap: 8px; }
        
        .tool-btn {
            width: 44px; height: 44px;
            border-radius: 12px;
            background: rgba(171, 205, 239, 0.2);
            border: none;
            cursor: pointer;
            font-size: 20px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        body.dark-theme .tool-btn { background: rgba(102, 126, 234, 0.2); }
        .tool-btn:hover { transform: scale(1.05); background: rgba(171, 205, 239, 0.4); }
        .tool-btn.active { background: #abcdef; box-shadow: 0 0 0 2px rgba(171, 205, 239, 0.5); }
        body.dark-theme .tool-btn.active { background: #4a4aff; }
        
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        
        .undo-redo { display: flex; gap: 8px; }
        .undo-redo .tool-btn { width: 48px; font-size: 18px; font-weight: 600; background: rgba(171, 205, 239, 0.25); }
        
        .action-buttons { display: flex; gap: 8px; }
        .action-buttons .btn-small { margin: 0; }
        
        .color-picker { display: flex; gap: 10px; margin: 10px 0; flex-wrap: wrap; }
        
        .color-option {
            width: 32px; height: 32px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
        }
        
        .color-option:hover { transform: scale(1.1); }
        .color-option.active { border-color: #fff; box-shadow: 0 0 0 2px #abcdef; }
        body.dark-theme .color-option.active { box-shadow: 0 0 0 2px #4a4aff; }
        
        .size-slider { width: 100%; margin: 10px 0; }
        
        .formula-input {
            background: rgba(171, 205, 239, 0.15);
            border-radius: 12px;
            padding: 12px;
            margin-top: 10px;
        }
        
        .formula-input select, .formula-input input {
            width: 100%;
            padding: 8px;
            margin: 5px 0;
            border-radius: 8px;
            border: 1px solid rgba(171, 205, 239, 0.3);
            font-family: monospace;
        }
        
        body.dark-theme .formula-input select,
        body.dark-theme .formula-input input {
            background: #2a2a3a;
            color: #e0e0e0;
            border-color: #4a4a5a;
        }
        
        .canvas-area {
            background: white;
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }
        
        body.dark-theme .canvas-area { background: #2a2a3a; }
        
        canvas {
            width: 100%;
            height: auto;
            background: inherit;
            border-radius: 15px;
            cursor: crosshair;
            display: block;
            border: 1px solid rgba(171, 205, 239, 0.3);
            touch-action: none;
        }
        
        .grid-checkbox { display: flex; align-items: center; gap: 8px; margin: 0 0 20px 0; }
        
        .btn-small { padding: 6px 16px; font-size: 13px; cursor: pointer; border-radius: 8px; border: none; transition: all 0.2s; }
        body.light-theme .btn-small { background: #abcdef; color: #333; }
        body.dark-theme .btn-small { background: #4a4aff; color: #fff; }
        .btn-small:hover { transform: scale(1.02); }
        
        .polygon-status {
            background: rgba(171, 205, 239, 0.2);
            border-radius: 10px;
            padding: 8px 12px;
            margin-top: 10px;
            font-size: 12px;
            text-align: center;
        }
        
        body.dark-theme .polygon-status { background: rgba(102, 126, 234, 0.2); }
        
        .extra-functions {
            display: flex;
            flex-wrap: nowrap;
            gap: 8px;
            margin-top: 10px;
            justify-content: space-between;
        }
        .extra-functions button {
            flex: 1;
            font-size: 16px;
            padding: 8px 0;
            cursor: pointer;
            border-radius: 8px;
            border: none;
            transition: all 0.2s;
            background: rgba(171, 205, 239, 0.3);
            color: #333;
            min-width: 50px;
        }
        body.dark-theme .extra-functions button {
            background: rgba(102, 126, 234, 0.3);
            color: #fff;
        }
        .extra-functions button.active { background: #abcdef; color: #333; }
        body.dark-theme .extra-functions button.active { background: #4a4aff; color: #fff; }
        .extra-functions button:hover { transform: scale(1.02); }
        
        .zoom-info {
            position: absolute;
            bottom: 25px;
            right: 25px;
            background: rgba(0,0,0,0.6);
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-family: monospace;
            pointer-events: none;
            z-index: 10;
        }
        
        @media (max-width: 768px) {
            .drawing-container { grid-template-columns: 1fr; min-height: auto; }
            .tools-panel { order: 2; }
            .canvas-area { order: 1; }
            .extra-functions { flex-wrap: wrap; }
            .extra-functions button { min-width: 60px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="../index.html" class="back-btn">← На главную</a>

        <div class="drawing-container">
            <div class="tools-panel">
                <div class="top-bar">
                    <div class="undo-redo">
                        <button class="tool-btn" id="undoBtn" title="Отменить">↩</button>
                        <button class="tool-btn" id="redoBtn" title="Вернуть">↪</button>
                    </div>
                    <div class="action-buttons">
                        <button class="btn-small" id="clearCanvasBtn">Очистить всё</button>
                        <button class="btn-small" id="saveCanvasBtn">Сохранить PNG</button>
                    </div>
                </div>
                
                <div class="tools-section">
                    <h3>Инструменты</h3>
                    <div class="tool-buttons">
                        <button class="tool-btn" data-tool="cursor" title="Перемещение">🖱️</button>
                        <button class="tool-btn" data-tool="point" title="Точка">🔵</button>
                        <button class="tool-btn" data-tool="line" title="Прямая линия">📏</button>
                        <button class="tool-btn" data-tool="rect" title="Прямоугольник">⬛</button>
                        <button class="tool-btn" data-tool="circle" title="Окружность">⚪</button>
                        <button class="tool-btn" data-tool="polygon" title="Многоугольник">🔺</button>
                        <button class="tool-btn" data-tool="freehand" title="Свободное рисование">✏️</button>
                        <button class="tool-btn" data-tool="eraser" title="Ластик">🧽</button>
                    </div>
                    <div id="polygonStatus" class="polygon-status" style="display: none;">
                        📍 Режим многоугольника: кликайте для добавления вершин.<br>
                        <button id="finishPolygonBtn" class="btn-small" style="margin-top: 5px;">✅ Завершить</button>
                    </div>
                </div>
                
                <div class="tools-section">
                    <label class="grid-checkbox">
                        <input type="checkbox" id="showGrid" checked> Показать сетку
                    </label>
                </div>
                
                <div class="tools-section">
                    <h3>Цвет</h3>
                    <div class="color-picker">
                        <div class="color-option" style="background: #000000;" data-color="#000000"></div>
                        <div class="color-option" style="background: #ffffff; border: 1px solid #ccc;" data-color="#ffffff"></div>
                        <div class="color-option" style="background: #ff0000;" data-color="#ff0000"></div>
                        <div class="color-option" style="background: #ff6600;" data-color="#ff6600"></div>
                        <div class="color-option" style="background: #ffcc00;" data-color="#ffcc00"></div>
                        <div class="color-option" style="background: #00ff00;" data-color="#00ff00"></div>
                        <div class="color-option" style="background: #00ccff;" data-color="#00ccff"></div>
                        <div class="color-option" style="background: #0000ff;" data-color="#0000ff"></div>
                        <div class="color-option" style="background: #9900ff;" data-color="#9900ff"></div>
                        <div class="color-option" style="background: #ff00ff;" data-color="#ff00ff"></div>
                        <div class="color-option" style="background: #ff69b4;" data-color="#ff69b4"></div>
                        <div class="color-option" style="background: #00ffaa;" data-color="#00ffaa"></div>
                    </div>
                </div>
                
                <div class="tools-section">
                    <h3>Размер</h3>
                    <input type="range" id="brushSize" class="size-slider" min="1" max="20" value="3">
                </div>
                
                <div class="tools-section">
                    <h3>Построение по формуле</h3>
                    <div class="formula-input">
                        <select id="formulaType">
                            <option value="line">Прямая: y = k·x + b</option>
                            <option value="circle">Окружность: (x - a)² + (y - b)² = r²</option>
                            <option value="parabola">Парабола: y = a·x² + b·x + c</option>
                            <option value="hyperbola">Гипербола: y = k / x</option>
                            <option value="sine">Синусоида: y = a·sin(b·x + c) + d</option>
                            <option value="cosine">Косинусоида: y = a·cos(b·x + c) + d</option>
                            <option value="exponential">Экспонента: y = a·e^(k·x)</option>
                        </select>
                        <div id="formulaParams"></div>
                        <button id="drawFormulaBtn" class="btn-small" style="margin-top: 8px; width: 100%;">Построить</button>
                    </div>
                </div>
                
                <div class="tools-section">
                    <h3>Штампы</h3>
                    <div class="extra-functions">
                        <button id="drawStarBtn">⭐</button>
                        <button id="drawHeartBtn">❤️</button>
                        <button id="drawSmileBtn">😊</button>
                        <button id="drawHouseBtn">🏠</button>
                        <button id="drawCatBtn">🐱</button>
                    </div>
                </div>
            </div>
            
            <div class="canvas-area">
                <canvas id="drawCanvas" width="900" height="900"></canvas>
                <div class="zoom-info" id="zoomInfo">100%</div>
            </div>
        </div>
    </div>

    <script src="../script.js"></script>
    <script>
        (function(){
            // ========== КОНСТАНТЫ ==========
            const SIZE = { w: 900, h: 900 };
            const GRID_SIZE = 35;
            const WORLD_W = 2000 * GRID_SIZE;
            const WORLD_H = 2000 * GRID_SIZE;
            const MIN_ZOOM = 0.3, MAX_ZOOM = 4;
            
            // ========== DOM ==========
            const canvas = document.getElementById('drawCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = SIZE.w;
            canvas.height = SIZE.h;
            
            // ========== КАМЕРА ==========
            let camera = { x: 0, y: 0, zoom: 1 };
            
            // ========== СОСТОЯНИЕ ==========
            let state = {
                shapes: [],
                history: [],
                historyIdx: -1,
                tool: 'cursor',
                color: '#000000',
                size: 3,
                drawing: false,
                start: null,
                last: null,
                polygonPts: [],
                selectedDrawing: null,
                panning: false,
                panStart: null,
                camStart: null
            };
            
            // ========== ДЛЯ ЗУМА ПАЛЬЦАМИ ==========
            let initialPinchDistance = 0;
            let initialZoom = 1;
            let pinchActive = false;
            let pinchCenter = null;
            
            // ========== ФУНКЦИИ КАМЕРЫ ==========
            const worldToScreen = (x, y) => ({
                x: (x - camera.x) * camera.zoom + SIZE.w/2,
                y: (y - camera.y) * camera.zoom + SIZE.h/2
            });
            
            const screenToWorld = (x, y) => ({
                x: (x - SIZE.w/2) / camera.zoom + camera.x,
                y: (y - SIZE.h/2) / camera.zoom + camera.y
            });
            
            const clampCamera = () => {
                const halfW = WORLD_W/2, halfH = WORLD_H/2;
                const viewW = SIZE.w / camera.zoom;
                const viewH = SIZE.h / camera.zoom;
                camera.x = Math.max(-halfW + viewW/2, Math.min(halfW - viewW/2, camera.x));
                camera.y = Math.max(-halfH + viewH/2, Math.min(halfH - viewH/2, camera.y));
            };
            
            const updateZoomInfo = () => 
                document.getElementById('zoomInfo').innerText = Math.round(camera.zoom * 100) + '%';
            
            const zoomAtPoint = (delta, screenX, screenY) => {
                const oldZoom = camera.zoom;
                let newZoom = oldZoom * (1 + delta * 0.1);
                newZoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, newZoom));
                if (newZoom === oldZoom) return;
                const before = screenToWorld(screenX, screenY);
                camera.zoom = newZoom;
                const after = screenToWorld(screenX, screenY);
                camera.x += before.x - after.x;
                camera.y += before.y - after.y;
                clampCamera();
                updateZoomInfo();
                draw();
            };
            
            // ========== ПРИВЯЗКА К СЕТКЕ ==========
            const isGridEnabled = () => document.getElementById('showGrid')?.checked === true;
            
            const snapPoint = (x, y) => {
                if (isGridEnabled()) {
                    return { x: Math.round(x / GRID_SIZE) * GRID_SIZE, y: Math.round(y / GRID_SIZE) * GRID_SIZE };
                }
                return { x, y };
            };
            
            // ========== ИСТОРИЯ ==========
            const saveHistory = () => {
                state.history = state.history.slice(0, state.historyIdx + 1);
                state.history.push(JSON.parse(JSON.stringify(state.shapes)));
                state.historyIdx++;
            };
            
            const undo = () => {
                if (state.historyIdx > 0) {
                    state.historyIdx--;
                    state.shapes = JSON.parse(JSON.stringify(state.history[state.historyIdx]));
                    draw();
                }
            };
            
            const redo = () => {
                if (state.historyIdx < state.history.length - 1) {
                    state.historyIdx++;
                    state.shapes = JSON.parse(JSON.stringify(state.history[state.historyIdx]));
                    draw();
                }
            };
            
            const addShape = (shape) => {
                state.shapes.push(shape);
                saveHistory();
                draw();
            };
            
            // ========== ОТРИСОВКА ==========
            const drawGrid = () => {
                const isDark = document.body.classList.contains('dark-theme');
                ctx.fillStyle = isDark ? '#2a2a3a' : '#ffffff';
                ctx.fillRect(0, 0, SIZE.w, SIZE.h);
                
                if (!isGridEnabled()) return;
                
                const topLeft = screenToWorld(0, 0);
                const bottomRight = screenToWorld(SIZE.w, SIZE.h);
                const startX = Math.floor(topLeft.x / GRID_SIZE) * GRID_SIZE;
                const endX = Math.ceil(bottomRight.x / GRID_SIZE) * GRID_SIZE;
                const startY = Math.floor(topLeft.y / GRID_SIZE) * GRID_SIZE;
                const endY = Math.ceil(bottomRight.y / GRID_SIZE) * GRID_SIZE;
                
                ctx.beginPath();
                ctx.strokeStyle = isDark ? '#4a4a5a' : '#e0e0e0';
                ctx.lineWidth = 0.5;
                
                for (let x = startX; x <= endX; x += GRID_SIZE) {
                    const sx = worldToScreen(x, 0).x;
                    if (sx >= 0 && sx <= SIZE.w) {
                        ctx.beginPath();
                        ctx.moveTo(sx, 0);
                        ctx.lineTo(sx, SIZE.h);
                        ctx.stroke();
                    }
                }
                for (let y = startY; y <= endY; y += GRID_SIZE) {
                    const sy = worldToScreen(0, y).y;
                    if (sy >= 0 && sy <= SIZE.h) {
                        ctx.beginPath();
                        ctx.moveTo(0, sy);
                        ctx.lineTo(SIZE.w, sy);
                        ctx.stroke();
                    }
                }
                
                const ox = worldToScreen(0, 0).x;
                const oy = worldToScreen(0, 0).y;
                ctx.beginPath();
                ctx.strokeStyle = isDark ? '#888' : '#999';
                ctx.lineWidth = 1.5;
                ctx.moveTo(0, oy);
                ctx.lineTo(SIZE.w, oy);
                ctx.moveTo(ox, 0);
                ctx.lineTo(ox, SIZE.h);
                ctx.stroke();
            };
            
            const drawShapes = () => {
                for (const s of state.shapes) {
                    ctx.beginPath();
                    ctx.strokeStyle = s.color;
                    ctx.fillStyle = s.color;
                    ctx.lineWidth = s.size;
                    
                    if (s.type === 'point') {
                        const p = worldToScreen(s.x, s.y);
                        ctx.arc(p.x, p.y, s.size, 0, 2*Math.PI);
                        ctx.fill();
                    } else if (s.type === 'line') {
                        const p1 = worldToScreen(s.x1, s.y1);
                        const p2 = worldToScreen(s.x2, s.y2);
                        ctx.moveTo(p1.x, p1.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.stroke();
                    } else if (s.type === 'rect') {
                        const p = worldToScreen(s.x, s.y);
                        const p2 = worldToScreen(s.x + s.w, s.y + s.h);
                        ctx.strokeRect(p.x, p.y, p2.x - p.x, p2.y - p.y);
                    } else if (s.type === 'circle') {
                        const c = worldToScreen(s.x, s.y);
                        const r = s.r * camera.zoom;
                        ctx.arc(c.x, c.y, r, 0, 2*Math.PI);
                        ctx.stroke();
                    } else if (s.type === 'polygon' && s.points.length) {
                        const pts = s.points.map(p => worldToScreen(p.x, p.y));
                        ctx.moveTo(pts[0].x, pts[0].y);
                        for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
                        ctx.closePath();
                        ctx.stroke();
                    } else if (s.type === 'freehand') {
                        for (let i = 1; i < s.points.length; i++) {
                            const p1 = worldToScreen(s.points[i-1].x, s.points[i-1].y);
                            const p2 = worldToScreen(s.points[i].x, s.points[i].y);
                            ctx.beginPath();
                            ctx.moveTo(p1.x, p1.y);
                            ctx.lineTo(p2.x, p2.y);
                            ctx.stroke();
                        }
                    }
                }
            };
            
            const draw = () => { drawGrid(); drawShapes(); };
            
            // ========== ВСПОМОГАТЕЛЬНЫЕ ==========
            const getMouseWorld = (clientX, clientY) => {
                const rect = canvas.getBoundingClientRect();
                const sx = (clientX - rect.left) * (SIZE.w / rect.width);
                const sy = (clientY - rect.top) * (SIZE.h / rect.height);
                return screenToWorld(sx, sy);
            };
            
            const getScreenFromEvent = (clientX, clientY) => {
                const rect = canvas.getBoundingClientRect();
                return { x: (clientX - rect.left) * (SIZE.w / rect.width), y: (clientY - rect.top) * (SIZE.h / rect.height) };
            };
            
            // ========== ЛАСТИК ==========
            const eraseAt = (x, y, radius) => {
                const toRemove = [];
                for (let i = 0; i < state.shapes.length; i++) {
                    const s = state.shapes[i];
                    if (s.type === 'point' && Math.hypot(s.x - x, s.y - y) < radius + 2) toRemove.push(i);
                    else if (s.type === 'line') {
                        const dist = pointToLineDist(x, y, s.x1, s.y1, s.x2, s.y2);
                        if (dist < radius + 2) toRemove.push(i);
                    }
                    else if (s.type === 'rect' && x >= s.x - radius && x <= s.x + s.w + radius && y >= s.y - radius && y <= s.y + s.h + radius) toRemove.push(i);
                    else if (s.type === 'circle' && Math.abs(Math.hypot(x - s.x, y - s.y) - s.r) < radius + 2) toRemove.push(i);
                    else if (s.type === 'polygon' && pointInPolygon(x, y, s.points)) toRemove.push(i);
                    else if (s.type === 'freehand' && s.points.some(p => Math.hypot(p.x - x, p.y - y) < radius + 2)) toRemove.push(i);
                }
                for (let i = toRemove.length - 1; i >= 0; i--) state.shapes.splice(toRemove[i], 1);
                if (toRemove.length) { saveHistory(); draw(); }
            };
            
            const pointToLineDist = (px, py, x1, y1, x2, y2) => {
                const A = px - x1, B = py - y1;
                const C = x2 - x1, D = y2 - y1;
                const dot = A*C + B*D;
                const len2 = C*C + D*D;
                let t = len2 ? dot / len2 : -1;
                let xx, yy;
                if (t < 0) { xx = x1; yy = y1; }
                else if (t > 1) { xx = x2; yy = y2; }
                else { xx = x1 + t*C; yy = y1 + t*D; }
                return Math.hypot(px - xx, py - yy);
            };
            
            const pointInPolygon = (px, py, points) => {
                let inside = false;
                for (let i = 0, j = points.length-1; i < points.length; j = i++) {
                    const xi = points[i].x, yi = points[i].y;
                    const xj = points[j].x, yj = points[j].y;
                    if (((yi > py) != (yj > py)) && (px < (xj - xi) * (py - yi) / (yj - yi) + xi)) inside = !inside;
                }
                return inside;
            };
            
            // ========== РИСУНКИ ==========
            const drawings = {
                star: (cx, cy) => {
                    const pts = [];
                    for (let i = 0, a = Math.PI/2; i < 10; i++, a += Math.PI/5) {
                        const r = i%2 === 0 ? 40 : 18;
                        pts.push({ x: cx + r * Math.cos(a), y: cy - r * Math.sin(a) });
                    }
                    addShape({ type: 'polygon', points: pts, color: state.color, size: state.size });
                },
                heart: (cx, cy) => {
                    const pts = [];
                    for (let t = 0; t <= 2*Math.PI; t += 0.05) {
                        const x = 16 * Math.pow(Math.sin(t), 3);
                        const y = 13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t);
                        pts.push({ x: cx + x*1.5, y: cy - y*1.5 });
                    }
                    addShape({ type: 'polygon', points: pts, color: state.color, size: state.size });
                },
                smile: (cx, cy) => {
                    addShape({ type: 'circle', x: cx, y: cy, r: 35, color: state.color, size: state.size });
                    addShape({ type: 'point', x: cx - 14, y: cy - 10, color: state.color, size: state.size });
                    addShape({ type: 'point', x: cx + 14, y: cy - 10, color: state.color, size: state.size });
                    const smile = [];
                    for (let a = 0.2; a <= Math.PI - 0.2; a += 0.05) smile.push({ x: cx + 22*Math.cos(a), y: cy + 15*Math.sin(a) });
                    addShape({ type: 'polygon', points: smile, color: state.color, size: state.size });
                },
                house: (cx, cy) => {
                    addShape({ type: 'rect', x: cx - 30, y: cy - 25, w: 60, h: 50, color: state.color, size: state.size });
                    addShape({ type: 'polygon', points: [{ x: cx - 38, y: cy - 25 }, { x: cx, y: cy - 60 }, { x: cx + 38, y: cy - 25 }], color: state.color, size: state.size });
                },
                cat: (cx, cy) => {
                    addShape({ type: 'circle', x: cx, y: cy, r: 30, color: state.color, size: state.size });
                    addShape({ type: 'polygon', points: [{ x: cx - 22, y: cy - 25 }, { x: cx - 35, y: cy - 48 }, { x: cx - 12, y: cy - 38 }], color: state.color, size: state.size });
                    addShape({ type: 'polygon', points: [{ x: cx + 22, y: cy - 25 }, { x: cx + 35, y: cy - 48 }, { x: cx + 12, y: cy - 38 }], color: state.color, size: state.size });
                    addShape({ type: 'point', x: cx - 11, y: cy - 6, color: state.color, size: state.size });
                    addShape({ type: 'point', x: cx + 11, y: cy - 6, color: state.color, size: state.size });
                    addShape({ type: 'point', x: cx, y: cy + 3, color: state.color, size: state.size });
                    addShape({ type: 'line', x1: cx - 18, y1: cy + 3, x2: cx - 6, y2: cy + 3, color: state.color, size: state.size });
                    addShape({ type: 'line', x1: cx + 18, y1: cy + 3, x2: cx + 6, y2: cy + 3, color: state.color, size: state.size });
                    addShape({ type: 'line', x1: cx - 17, y1: cy + 9, x2: cx - 5, y2: cy + 6, color: state.color, size: state.size });
                    addShape({ type: 'line', x1: cx + 17, y1: cy + 9, x2: cx + 5, y2: cy + 6, color: state.color, size: state.size });
                }
            };
            
            // ========== ФОРМУЛЫ ==========
            const formulas = {
                line: (p, x) => p.k * x + p.b,
                parabola: (p, x) => p.a * x * x + p.b * x + p.c,
                hyperbola: (p, x) => p.k / x,
                sine: (p, x) => p.a * Math.sin(p.b * x + p.c) + p.d,
                cosine: (p, x) => p.a * Math.cos(p.b * x + c) + p.d,
                exponential: (p, x) => p.a * Math.exp(p.k * x)
            };

            const drawFormula = (type, params) => {
                const fn = formulas[type];
                if (!fn) return;
                
                // Определяем видимую область в МИРОВЫХ КООРДИНАТАХ (пикселях)
                const topLeft = screenToWorld(0, 0);
                const bottomRight = screenToWorld(SIZE.w, SIZE.h);
                let startX_px = Math.min(topLeft.x, bottomRight.x);
                let endX_px = Math.max(topLeft.x, bottomRight.x);
                
                // Ограничиваем область построения
                startX_px = Math.max(-WORLD_W / 2, startX_px);
                endX_px = Math.min(WORLD_W / 2, endX_px);
                
                // Переводим в КЛЕТКИ (математические координаты)
                // В одной клетке = GRID_SIZE пикселей, центр координат в (0,0)
                let startX_cell = startX_px / GRID_SIZE;
                let endX_cell = endX_px / GRID_SIZE;
                
                // Шаг в клетках (зависит от масштаба, но не мельче 0.05)
                const step = Math.max(0.05, 0.5 / camera.zoom);
                
                let lastPoint = null;
                let lastValid = false;
                
                for (let x_cell = startX_cell; x_cell <= endX_cell; x_cell += step) {
                    let y_cell;
                    try {
                        y_cell = fn(params, x_cell);
                        if (isNaN(y_cell) || !isFinite(y_cell) || Math.abs(y_cell) > 2000) {
                            lastValid = false;
                            lastPoint = null;
                            continue;
                        }
                    } catch(e) {
                        lastValid = false;
                        lastPoint = null;
                        continue;
                    }
                    
                    // Переводим обратно в пиксели для отрисовки
                    const x_px = x_cell * GRID_SIZE;
                    const y_px = -y_cell * GRID_SIZE;  // минус, потому что Y вверх
                    
                    if (lastValid && lastPoint !== null) {
                        addShape({
                            type: 'line',
                            x1: lastPoint.x,
                            y1: lastPoint.y,
                            x2: x_px,
                            y2: y_px,
                            color: state.color,
                            size: state.size
                        });
                    }
                    lastPoint = { x: x_px, y: y_px };
                    lastValid = true;
                }
            };
            
            // ========== ОБРАБОТЧИКИ ==========
            const finishPolygon = () => {
                if (state.polygonPts.length >= 3) addShape({ type: 'polygon', points: [...state.polygonPts], color: state.color, size: state.size });
                state.polygonPts = [];
                document.getElementById('polygonStatus').style.display = 'none';
                if (state.tool === 'polygon') {
                    state.tool = 'cursor';
                    document.querySelectorAll('[data-tool]').forEach(b => b.classList.remove('active'));
                    document.querySelector('[data-tool="cursor"]').classList.add('active');
                }
            };
            
            const onPointerDown = (e) => {
                e.preventDefault();
                const world = getMouseWorld(e.clientX, e.clientY);
                const snapped = snapPoint(world.x, world.y);
                
                if (state.selectedDrawing) {
                    drawings[state.selectedDrawing]?.(snapped.x, snapped.y);
                    state.selectedDrawing = null;
                    document.querySelectorAll('.extra-functions button').forEach(b => b.classList.remove('active'));
                    return;
                }
                
                if (state.tool === 'cursor') {
                    state.panning = true;
                    state.panStart = getScreenFromEvent(e.clientX, e.clientY);
                    state.camStart = { x: camera.x, y: camera.y };
                    canvas.style.cursor = 'grabbing';
                    return;
                }
                
                if (state.tool === 'polygon') {
                    state.polygonPts.push(snapped);
                    document.getElementById('polygonStatus').style.display = 'block';
                    draw();
                    for (let p of state.polygonPts) {
                        const sp = worldToScreen(p.x, p.y);
                        ctx.beginPath();
                        ctx.arc(sp.x, sp.y, state.size, 0, 2*Math.PI);
                        ctx.fillStyle = state.color;
                        ctx.fill();
                    }
                    if (state.polygonPts.length > 1) {
                        const first = worldToScreen(state.polygonPts[0].x, state.polygonPts[0].y);
                        ctx.beginPath();
                        ctx.moveTo(first.x, first.y);
                        for (let i = 1; i < state.polygonPts.length; i++) {
                            const p = worldToScreen(state.polygonPts[i].x, state.polygonPts[i].y);
                            ctx.lineTo(p.x, p.y);
                        }
                        ctx.strokeStyle = state.color;
                        ctx.lineWidth = state.size;
                        ctx.stroke();
                    }
                    return;
                }
                
                state.drawing = true;
                state.start = snapped;
                state.last = snapped;
                
                if (state.tool === 'point') {
                    addShape({ type: 'point', x: snapped.x, y: snapped.y, color: state.color, size: state.size });
                    state.drawing = false;
                } else if (state.tool === 'eraser') {
                    eraseAt(snapped.x, snapped.y, state.size * 2);
                    state.drawing = false;
                }
            };
            
            const onPointerMove = (e) => {
                const world = getMouseWorld(e.clientX, e.clientY);
                const snapped = snapPoint(world.x, world.y);
                
                if (state.panning) {
                    const screen = getScreenFromEvent(e.clientX, e.clientY);
                    const dx = screen.x - state.panStart.x;
                    const dy = screen.y - state.panStart.y;
                    camera.x = state.camStart.x - dx / camera.zoom;
                    camera.y = state.camStart.y - dy / camera.zoom;
                    clampCamera();
                    draw();
                    return;
                }
                
                if (!state.drawing) return;
                
                if (state.tool === 'eraser') {
                    eraseAt(snapped.x, snapped.y, state.size * 2);
                    return;
                }
                
                if (state.tool === 'freehand') {
                    addShape({ type: 'line', x1: state.last.x, y1: state.last.y, x2: snapped.x, y2: snapped.y, color: state.color, size: state.size });
                    state.last = snapped;
                    return;
                }
                
                if ((state.tool === 'line' || state.tool === 'rect' || state.tool === 'circle') && state.start) {
                    draw();
                    const s = worldToScreen(state.start.x, state.start.y);
                    const e = worldToScreen(snapped.x, snapped.y);
                    ctx.beginPath();
                    if (state.tool === 'line') { ctx.moveTo(s.x, s.y); ctx.lineTo(e.x, e.y); }
                    else if (state.tool === 'rect') ctx.strokeRect(s.x, s.y, e.x - s.x, e.y - s.y);
                    else { const r = Math.hypot(e.x - s.x, e.y - s.y); ctx.arc(s.x, s.y, r, 0, 2*Math.PI); }
                    ctx.strokeStyle = state.color;
                    ctx.lineWidth = state.size;
                    ctx.stroke();
                }
            };
            
            const onPointerUp = (e) => {
                if (state.panning) {
                    state.panning = false;
                    canvas.style.cursor = 'crosshair';
                    return;
                }
                if (!state.drawing) return;
                
                const world = getMouseWorld(e.clientX, e.clientY);
                const snapped = snapPoint(world.x, world.y);
                
                if (state.tool === 'line' && state.start) {
                    addShape({ type: 'line', x1: state.start.x, y1: state.start.y, x2: snapped.x, y2: snapped.y, color: state.color, size: state.size });
                } else if (state.tool === 'rect' && state.start) {
                    addShape({ type: 'rect', x: state.start.x, y: state.start.y, w: snapped.x - state.start.x, h: snapped.y - state.start.y, color: state.color, size: state.size });
                } else if (state.tool === 'circle' && state.start) {
                    const r = Math.hypot(snapped.x - state.start.x, snapped.y - state.start.y);
                    addShape({ type: 'circle', x: state.start.x, y: state.start.y, r, color: state.color, size: state.size });
                }
                
                state.start = null;
                state.drawing = false;
                draw();
            };
            
            // ========== ОБРАБОТКА МУЛЬТИТАЧА ДЛЯ ЗУМА ==========
            const getTouchDistance = (touches) => {
                const dx = touches[0].clientX - touches[1].clientX;
                const dy = touches[0].clientY - touches[1].clientY;
                return Math.hypot(dx, dy);
            };
            
            const getTouchCenter = (touches) => {
                const rect = canvas.getBoundingClientRect();
                const x = (touches[0].clientX + touches[1].clientX) / 2;
                const y = (touches[0].clientY + touches[1].clientY) / 2;
                const sx = (x - rect.left) * (SIZE.w / rect.width);
                const sy = (y - rect.top) * (SIZE.h / rect.height);
                return { x: sx, y: sy };
            };
            
            const onTouchStart = (e) => {
                e.preventDefault();
                if (e.touches.length === 2) {
                    pinchActive = true;
                    initialPinchDistance = getTouchDistance(e.touches);
                    initialZoom = camera.zoom;
                    const center = getTouchCenter(e.touches);
                    pinchCenter = center;
                } else if (e.touches.length === 1) {
                    const touch = e.touches[0];
                    const fakeEvent = { clientX: touch.clientX, clientY: touch.clientY, preventDefault: () => {} };
                    onPointerDown(fakeEvent);
                }
            };
            
            const onTouchMove = (e) => {
                e.preventDefault();
                if (e.touches.length === 2 && pinchActive) {
                    const newDistance = getTouchDistance(e.touches);
                    const delta = newDistance / initialPinchDistance;
                    if (delta > 0.01) {
                        const newZoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, initialZoom * delta));
                        if (newZoom !== camera.zoom && pinchCenter) {
                            const before = screenToWorld(pinchCenter.x, pinchCenter.y);
                            camera.zoom = newZoom;
                            const after = screenToWorld(pinchCenter.x, pinchCenter.y);
                            camera.x += before.x - after.x;
                            camera.y += before.y - after.y;
                            clampCamera();
                            updateZoomInfo();
                            draw();
                        }
                    }
                } else if (e.touches.length === 1 && !state.panning) {
                    const touch = e.touches[0];
                    const fakeEvent = { clientX: touch.clientX, clientY: touch.clientY, preventDefault: () => {} };
                    onPointerMove(fakeEvent);
                }
            };
            
            const onTouchEnd = (e) => {
                e.preventDefault();
                pinchActive = false;
                if (state.drawing || state.panning) {
                    onPointerUp({ clientX: 0, clientY: 0 });
                }
                state.panning = false;
                state.drawing = false;
                canvas.style.cursor = 'crosshair';
            };
            
            // ========== НАСТРОЙКИ ИНТЕРФЕЙСА ==========
            const setupTools = () => {
                document.querySelectorAll('[data-tool]').forEach(btn => {
                    btn.addEventListener('click', () => {
                        if (state.tool === 'polygon' && state.polygonPts.length) finishPolygon();
                        document.querySelectorAll('[data-tool]').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        state.tool = btn.dataset.tool;
                        state.selectedDrawing = null;
                        document.querySelectorAll('.extra-functions button').forEach(b => b.classList.remove('active'));
                        if (state.tool !== 'polygon') { state.polygonPts = []; document.getElementById('polygonStatus').style.display = 'none'; draw(); }
                    });
                });
            };
            
            const setupColors = () => {
                document.querySelectorAll('.color-option').forEach(opt => {
                    opt.addEventListener('click', () => {
                        document.querySelectorAll('.color-option').forEach(o => o.classList.remove('active'));
                        opt.classList.add('active');
                        state.color = opt.dataset.color;
                    });
                });
            };
            
            const setupExtra = () => {
                const btns = { drawStarBtn: 'star', drawHeartBtn: 'heart', drawSmileBtn: 'smile', drawHouseBtn: 'house', drawCatBtn: 'cat' };
                Object.entries(btns).forEach(([id, name]) => {
                    document.getElementById(id).addEventListener('click', () => {
                        state.selectedDrawing = name;
                        document.querySelectorAll('[data-tool]').forEach(b => b.classList.remove('active'));
                        state.tool = null;
                        document.querySelectorAll('.extra-functions button').forEach(b => b.classList.remove('active'));
                        document.getElementById(id).classList.add('active');
                    });
                });
            };
            
            const setupFormula = () => {
                const typeSel = document.getElementById('formulaType');
                const paramsDiv = document.getElementById('formulaParams');
                const configs = {
                    line: () => `<input type="number" id="k" value="1" step="0.1"><input type="number" id="b" value="0" step="0.1">`,
                    circle: () => `<input type="number" id="a" value="0" step="0.1"><input type="number" id="b" value="0" step="0.1"><input type="number" id="r" value="2" step="0.5">`,
                    parabola: () => `<input type="number" id="a" value="1" step="0.1"><input type="number" id="b" value="0" step="0.1"><input type="number" id="c" value="0" step="0.1">`,
                    hyperbola: () => `<input type="number" id="k" value="1" step="1">`,
                    sine: () => `<input type="number" id="a" value="1" step="1"><input type="number" id="b" value="1" step="0.1"><input type="number" id="c" value="0" step="0.1"><input type="number" id="d" value="0" step="1">`,
                    cosine: () => `<input type="number" id="a" value="1" step="1"><input type="number" id="b" value="1" step="0.1"><input type="number" id="c" value="0" step="0.1"><input type="number" id="d" value="0" step="1">`,
                    exponential: () => `<input type="number" id="a" value="1" step="1"><input type="number" id="k" value="0.5" step="0.1">`
                };
                const update = () => paramsDiv.innerHTML = configs[typeSel.value]?.() || '';
                typeSel.addEventListener('change', update);
                update();
                
                document.getElementById('drawFormulaBtn').addEventListener('click', () => {
                    const type = typeSel.value;
                    const get = (id) => parseFloat(document.getElementById(id)?.value);
                    const maps = {
                        line: () => ({ k: get('k'), b: get('b') }),
                        circle: () => ({ a: get('a'), b: get('b'), r: get('r') }),
                        parabola: () => ({ a: get('a'), b: get('b'), c: get('c') }),
                        hyperbola: () => ({ k: get('k') }),
                        sine: () => ({ a: get('a'), b: get('b'), c: get('c'), d: get('d') }),
                        cosine: () => ({ a: get('a'), b: get('b'), c: get('c'), d: get('d') }),
                        exponential: () => ({ a: get('a'), k: get('k') })
                    };
                    const p = maps[type]?.();
                    if (p && Object.values(p).every(v => !isNaN(v))) {
                        if (type === 'circle') {
                            // Окружность в мировых координатах
                            const centerX = p.a * GRID_SIZE;
                            const centerY = -p.b * GRID_SIZE;
                            const radius = p.r * GRID_SIZE;
                            addShape({
                                type: 'circle',
                                x: centerX,
                                y: centerY,
                                r: radius,
                                color: state.color,
                                size: state.size
                            });
                        } else {
                            drawFormula(type, p);
                        }
                    }
                });
            };
            
            // ========== СОБЫТИЯ ==========
            const setupEvents = () => {
                canvas.addEventListener('wheel', e => {
                    e.preventDefault();
                    const rect = canvas.getBoundingClientRect();
                    const sx = (e.clientX - rect.left) * (SIZE.w / rect.width);
                    const sy = (e.clientY - rect.top) * (SIZE.h / rect.height);
                    zoomAtPoint(e.deltaY > 0 ? -1 : 1, sx, sy);
                }, { passive: false });
                
                canvas.addEventListener('pointerdown', onPointerDown);
                canvas.addEventListener('pointermove', onPointerMove);
                canvas.addEventListener('pointerup', onPointerUp);
                canvas.addEventListener('contextmenu', e => e.preventDefault());
                
                canvas.addEventListener('touchstart', onTouchStart, { passive: false });
                canvas.addEventListener('touchmove', onTouchMove, { passive: false });
                canvas.addEventListener('touchend', onTouchEnd);
                canvas.addEventListener('touchcancel', onTouchEnd);
            };
            
            // ========== ИНИЦИАЛИЗАЦИЯ ==========
            const init = () => {
                clampCamera();
                updateZoomInfo();
                saveHistory();
                draw();
                setupEvents();
                document.getElementById('showGrid').addEventListener('change', () => draw());
                document.getElementById('clearCanvasBtn').addEventListener('click', () => { state.shapes = []; saveHistory(); draw(); });
                document.getElementById('saveCanvasBtn').addEventListener('click', () => {
                    const link = document.createElement('a');
                    link.download = 'drawing.png';
                    link.href = canvas.toDataURL();
                    link.click();
                });
                document.getElementById('undoBtn').addEventListener('click', undo);
                document.getElementById('redoBtn').addEventListener('click', redo);
                document.getElementById('finishPolygonBtn').addEventListener('click', finishPolygon);
                document.getElementById('brushSize').addEventListener('input', e => state.size = parseInt(e.target.value));
                setupTools();
                setupColors();
                setupExtra();
                setupFormula();
                new MutationObserver(() => draw()).observe(document.body, { attributes: true, attributeFilter: ['class'] });
            };
            
            init();
        })();
    </script>
</body>
</html>
